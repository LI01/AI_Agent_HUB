<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1280" />
  <title>Agent Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    @keyframes sse-pulse {
      0%   { box-shadow: 0 0 0 0 rgba(16,185,129,.6); }
      70%  { box-shadow: 0 0 0 6px rgba(16,185,129,0); }
      100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); }
    }
    .sse-pulse { animation: sse-pulse 1.6s infinite; }
    html, body { height: 100%; }
    body { background: #0f172a; color: #e2e8f0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .markdown :is(h1,h2,h3) { font-weight: 600; margin: .6em 0 .3em; }
    .markdown h1 { font-size: 1.1rem; }
    .markdown h2 { font-size: 1.0rem; }
    .markdown h3 { font-size: .95rem; }
    .markdown p { margin: .4em 0; }
    .markdown code { background: rgba(148,163,184,.18); padding: 0 .25rem; border-radius: 3px; font-size: .8rem; }
    .markdown pre { background: rgba(15,23,42,.7); padding: .5rem; border-radius: 4px; overflow-x: auto; font-size: .75rem; }
    .markdown ul, .markdown ol { margin: .4em 0 .4em 1.2em; }
    .markdown a { color: #93c5fd; text-decoration: underline; }
  </style>
</head>
<body x-data="hub()" x-init="init()" class="h-screen overflow-hidden">

  <!-- Top bar -->
  <header id="topbar" class="h-14 flex items-center justify-between border-b border-slate-800 px-4 bg-slate-950">
    <div class="flex items-center gap-3">
      <div class="text-base font-semibold tracking-tight">Agent Hub</div>
      <div class="hidden sm:flex items-center gap-2 text-xs text-slate-400">
        <span class="px-2 py-0.5 rounded bg-slate-800/70">Agents <span class="text-slate-100 font-medium" x-text="stats?.agents?.total ?? 0"></span></span>
        <span class="px-2 py-0.5 rounded bg-slate-800/70">Online <span class="text-emerald-400 font-medium" x-text="stats?.agents?.online ?? 0"></span></span>
        <span class="px-2 py-0.5 rounded bg-slate-800/70">Tasks <span class="text-slate-100 font-medium" x-text="totalTasks()"></span></span>
        <span class="px-2 py-0.5 rounded bg-slate-800/70">Running <span class="text-amber-400 font-medium" x-text="stats?.tasks?.running ?? 0"></span></span>
      </div>
    </div>
    <div id="me-toggles" class="flex items-center gap-2">
      <button id="me-keys-toggle" @click="$store.mePanels.keys = !$store.mePanels.keys" class="text-slate-300 hover:text-white text-xs px-2 py-1 rounded bg-slate-800/70 hover:bg-slate-700">My API Keys</button>
      <button id="me-usage-toggle" @click="$store.mePanels.usage = !$store.mePanels.usage" class="text-slate-300 hover:text-white text-xs px-2 py-1 rounded bg-slate-800/70 hover:bg-slate-700">Usage</button>
    </div>
    <div class="flex items-center gap-2 text-xs">
      <span :class="heartbeatDotClass()" class="inline-block w-2.5 h-2.5 rounded-full" :style="heartbeatDotStyle()"></span>
      <span class="text-slate-300" x-text="heartbeatLabel()"></span>
    </div>
  </header>
  <div id="me-panels">
    <section id="me-keys-panel" x-data="meKeys()" x-init="init()" x-show="$store.mePanels.keys" :hidden="!$store.mePanels.keys"
             class="border-b border-slate-800 bg-slate-950/60 px-4 py-3 text-xs">
      <div class="flex items-center justify-between mb-3">
        <div class="text-sm font-semibold text-slate-100">My API Keys</div>
        <button @click="$store.mePanels.keys = false" class="text-slate-400 hover:text-slate-200">close</button>
      </div>

      <template x-if="error">
        <div class="mb-3 px-3 py-2 rounded bg-red-900/40 text-red-300" x-text="error"></div>
      </template>

      <template x-if="newKeyValue">
        <div class="mb-3 px-3 py-2 rounded bg-amber-900/30 border border-amber-700/60">
          <div class="text-amber-200 font-medium mb-1">This key is shown ONCE. Copy it now.</div>
          <div class="flex items-center gap-2">
            <code class="flex-1 break-all font-mono text-[11px] text-amber-100 bg-slate-900/70 rounded px-2 py-1" x-text="newKeyValue"></code>
            <button @click="copyKey()" class="text-[11px] px-2 py-1 rounded bg-emerald-700 hover:bg-emerald-600 text-white" x-text="copyLabel"></button>
            <button @click="newKeyValue = null; copyLabel = 'Copy'" class="text-[11px] text-slate-400 hover:text-slate-200">dismiss</button>
          </div>
        </div>
      </template>

      <div class="mb-3 flex items-end gap-2">
        <div class="flex-1">
          <label class="block text-[10px] uppercase tracking-wider text-slate-500 mb-1">New key name</label>
          <input type="text" x-model="newKeyName" placeholder="e.g. muffinluo-laptop"
                 @keydown.enter.prevent="createKey()"
                 class="w-full px-2 py-1 rounded bg-slate-900 border border-slate-700 text-slate-100 text-xs focus:outline-none focus:border-emerald-500" />
        </div>
        <button @click="createKey()" :disabled="creating || !newKeyName"
                class="text-xs px-3 py-1 rounded bg-emerald-700 hover:bg-emerald-600 disabled:bg-slate-700 disabled:text-slate-500 text-white"
                x-text="creating ? 'Creating…' : 'Create key'"></button>
      </div>

      <template x-if="loading">
        <div class="text-slate-400 italic">Loading…</div>
      </template>

      <template x-if="!loading && keys.length === 0 && !error">
        <div class="text-slate-500 italic">No keys yet.</div>
      </template>

      <template x-if="!loading && keys.length > 0">
        <table class="w-full text-[11px]">
          <thead>
            <tr class="text-left text-slate-500 uppercase tracking-wider text-[10px]">
              <th class="py-1 pr-2">Name</th>
              <th class="py-1 pr-2">Owner</th>
              <th class="py-1 pr-2">Created</th>
              <th class="py-1 pr-2">Expires</th>
              <th class="py-1"></th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-800/60">
            <template x-for="k in keys" :key="k.name">
              <tr>
                <td class="py-1 pr-2 font-mono text-slate-200" x-text="k.name"></td>
                <td class="py-1 pr-2 text-slate-300" x-text="k.owner || '—'"></td>
                <td class="py-1 pr-2 text-slate-400" x-text="(k.created_at || '').slice(0,19)"></td>
                <td class="py-1 pr-2 text-slate-400" x-text="(k.expires_at || '').slice(0,19) || '—'"></td>
                <td class="py-1 text-right">
                  <button @click="revokeKey(k.name)" class="text-red-400 hover:text-red-300 underline">Revoke</button>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </template>
    </section>
    <section id="me-usage-panel" x-data="meUsage()" x-init="init()" x-show="$store.mePanels.usage" :hidden="!$store.mePanels.usage" class="border-b border-slate-800 bg-slate-950/60 px-4 py-3 text-xs">
      <div class="flex flex-wrap items-end gap-3 mb-3">
        <label class="flex flex-col text-[10px] uppercase tracking-wider text-slate-500">From
          <input type="date" x-model="filters.from" class="mt-1 bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-slate-100" />
        </label>
        <label class="flex flex-col text-[10px] uppercase tracking-wider text-slate-500">To
          <input type="date" x-model="filters.to" class="mt-1 bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-slate-100" />
        </label>
        <label class="flex flex-col text-[10px] uppercase tracking-wider text-slate-500">Agent
          <input type="text" x-model="filters.agent" placeholder="(any)" class="mt-1 bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-slate-100" />
        </label>
        <label class="flex items-center gap-1 text-[11px] text-slate-300">
          <input type="checkbox" x-model="filters.top_level_only" class="accent-emerald-500" />
          top-level only
        </label>
        <button @click="applyFilters()" class="px-3 py-1 rounded bg-emerald-600 hover:bg-emerald-500 text-white text-xs">Apply</button>
        <template x-if="loading"><span class="text-slate-400">loading…</span></template>
        <template x-if="error"><span class="text-red-400" x-text="error"></span></template>
      </div>

      <div class="grid grid-cols-3 gap-3 mb-3">
        <div class="bg-slate-900/60 rounded p-2"><div class="text-[10px] uppercase tracking-wider text-slate-500">Total cost</div><div class="text-base font-semibold text-emerald-300" x-text="'$' + (totals.total_cost_usd ?? 0).toFixed(4)"></div></div>
        <div class="bg-slate-900/60 rounded p-2"><div class="text-[10px] uppercase tracking-wider text-slate-500">Total tasks</div><div class="text-base font-semibold text-slate-100" x-text="totals.row_count ?? 0"></div></div>
        <div class="bg-slate-900/60 rounded p-2"><div class="text-[10px] uppercase tracking-wider text-slate-500">Days w/ activity</div><div class="text-base font-semibold text-slate-100" x-text="byDay.length"></div></div>
      </div>

      <div class="grid grid-cols-2 gap-3 mb-3">
        <div class="bg-slate-900/60 rounded p-2"><div class="text-[10px] uppercase tracking-wider text-slate-500 mb-1">Cost per day</div><canvas x-ref="dayCanvas" height="120"></canvas></div>
        <div class="bg-slate-900/60 rounded p-2"><div class="text-[10px] uppercase tracking-wider text-slate-500 mb-1">Cost by agent</div><canvas x-ref="agentCanvas" height="120"></canvas></div>
      </div>

      <div class="text-[10px] uppercase tracking-wider text-slate-500 mb-1">Recent runs</div>
      <template x-if="rows.length === 0 && !loading">
        <div class="text-slate-500 italic py-2">No usage in selected range.</div>
      </template>
      <template x-if="rows.length > 0">
        <div class="overflow-x-auto max-h-72">
          <table class="w-full text-[11px]">
            <thead class="text-slate-500 uppercase tracking-wider text-[10px]">
              <tr>
                <th class="text-left py-1 pr-2 cursor-pointer select-none" @click="sortBy('task_id')">task_id<span x-text="sortKey==='task_id' ? (sortDir==='asc'?' ▲':' ▼') : ''"></span></th>
                <th class="text-left py-1 pr-2 cursor-pointer select-none" @click="sortBy('parent_task_id')">parent<span x-text="sortKey==='parent_task_id' ? (sortDir==='asc'?' ▲':' ▼') : ''"></span></th>
                <th class="text-left py-1 pr-2 cursor-pointer select-none" @click="sortBy('agent_id')">agent<span x-text="sortKey==='agent_id' ? (sortDir==='asc'?' ▲':' ▼') : ''"></span></th>
                <th class="text-left py-1 pr-2 cursor-pointer select-none" @click="sortBy('cli')">cli<span x-text="sortKey==='cli' ? (sortDir==='asc'?' ▲':' ▼') : ''"></span></th>
                <th class="text-left py-1 pr-2 cursor-pointer select-none" @click="sortBy('status')">status<span x-text="sortKey==='status' ? (sortDir==='asc'?' ▲':' ▼') : ''"></span></th>
                <th class="text-right py-1 pr-2 cursor-pointer select-none" @click="sortBy('duration_seconds')">dur<span x-text="sortKey==='duration_seconds' ? (sortDir==='asc'?' ▲':' ▼') : ''"></span></th>
                <th class="text-right py-1 pr-2 cursor-pointer select-none" @click="sortBy('cost_usd')">cost<span x-text="sortKey==='cost_usd' ? (sortDir==='asc'?' ▲':' ▼') : ''"></span></th>
                <th class="text-left py-1 cursor-pointer select-none" @click="sortBy('completed_at')">completed_at<span x-text="sortKey==='completed_at' ? (sortDir==='asc'?' ▲':' ▼') : ''"></span></th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-800/60">
              <template x-for="r in sortedRows()" :key="r.task_id">
                <tr class="text-slate-200">
                  <td class="py-1 pr-2"><code class="text-[10px] text-slate-400" x-text="(r.task_id || '').slice(0,8)"></code></td>
                  <td class="py-1 pr-2"><code class="text-[10px] text-slate-400" x-text="r.parent_task_id ? r.parent_task_id.slice(0,8) : ''"></code></td>
                  <td class="py-1 pr-2" x-text="r.agent_id || '—'"></td>
                  <td class="py-1 pr-2" x-text="r.cli || '—'"></td>
                  <td class="py-1 pr-2" x-text="r.status || '—'"></td>
                  <td class="py-1 pr-2 text-right" x-text="r.duration_seconds != null ? r.duration_seconds.toFixed(1) + 's' : '—'"></td>
                  <td class="py-1 pr-2 text-right" x-text="r.cost_usd != null ? '$' + r.cost_usd.toFixed(4) : '—'"></td>
                  <td class="py-1 text-slate-400" x-text="r.completed_at || '—'"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </template>
    </section>
  </div>

  <!-- Three-pane body -->
  <main class="flex" style="height: calc(100vh - 3.5rem);">

    <!-- Left sidebar: agents -->
    <aside id="sidebar" class="w-64 shrink-0 border-r border-slate-800 overflow-y-auto bg-slate-950/40">
      <div class="px-3 py-2 text-[11px] uppercase tracking-wider text-slate-500 sticky top-0 bg-slate-950/80 backdrop-blur">
        Agents
        <template x-if="selectedAgent">
          <button @click="selectedAgent = null" class="ml-2 text-[10px] normal-case text-slate-400 hover:text-slate-200 underline">clear filter</button>
        </template>
      </div>

      <template x-if="agents.length === 0 && !loadErrors.agents">
        <div class="px-3 py-4 text-xs text-slate-500">No agents registered.</div>
      </template>
      <template x-if="loadErrors.agents">
        <div class="px-3 py-4 text-xs text-red-400" x-text="loadErrors.agents"></div>
      </template>

      <template x-for="agent in sortedAgents()" :key="agent.agent_id">
        <button
          @click="toggleAgent(agent.agent_id)"
          :class="selectedAgent === agent.agent_id ? 'bg-slate-800/80 border-l-2 border-emerald-400' : 'border-l-2 border-transparent hover:bg-slate-800/40'"
          class="w-full text-left px-3 py-2 flex items-start gap-2 transition-colors"
          :title="agent.description || ''">
          <span :class="statusDot(agent.status)" class="inline-block w-2.5 h-2.5 rounded-full mt-1.5 shrink-0"></span>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-1.5">
              <span class="text-sm font-medium truncate" x-text="agent.name || agent.agent_id"></span>
              <template x-if="cliBadge(agent)">
                <span :class="cliBadge(agent).cls" class="text-[10px] px-1.5 py-0.5 rounded font-medium uppercase tracking-wide text-white"
                      x-text="cliBadge(agent).label"></span>
              </template>
            </div>
            <div class="text-[11px] text-slate-400 truncate" x-text="agentSubtitle(agent)"></div>
            <div class="text-[10px] text-slate-500" x-text="'· ' + relTime(agent.last_heartbeat)"></div>
          </div>
        </button>
      </template>
    </aside>

    <!-- Center: task feed -->
    <section id="feed" class="flex-1 overflow-y-auto">
      <div class="px-4 py-2 text-[11px] uppercase tracking-wider text-slate-500 border-b border-slate-800 sticky top-0 bg-slate-950/80 backdrop-blur flex items-center gap-3">
        <span>Tasks</span>
        <template x-if="selectedAgent">
          <span class="text-[11px] normal-case tracking-normal text-emerald-300">filtered by <span x-text="selectedAgent"></span></span>
        </template>
      </div>

      <template x-if="loadErrors.tasks">
        <div class="px-4 py-4 text-xs text-red-400" x-text="loadErrors.tasks"></div>
      </template>

      <template x-if="!loadErrors.tasks && filteredTasks().length === 0 && tasks.length === 0">
        <div class="px-4 py-6 text-xs text-slate-500">No tasks yet.</div>
      </template>

      <template x-if="!loadErrors.tasks && filteredTasks().length === 0 && tasks.length > 0 && selectedAgent">
        <div class="px-4 py-6 text-xs text-slate-500">
          No tasks for <span x-text="selectedAgent"></span>.
          <button @click="selectedAgent = null" class="ml-2 underline text-emerald-300">Clear filter</button>
        </div>
      </template>

      <template x-for="t in filteredTasks()" :key="t.task_id">
        <button @click="selectTask(t.task_id)"
          :class="selectedTaskId === t.task_id ? 'bg-slate-800/60' : 'hover:bg-slate-800/30'"
          class="w-full text-left px-4 py-3 border-b border-slate-800/60 flex items-start gap-3">
          <span :class="statusDot(t.status)" class="inline-block w-2.5 h-2.5 rounded-full mt-1.5 shrink-0"></span>
          <div class="flex-1 min-w-0">
            <div class="text-sm text-slate-100 truncate" x-text="truncate(t.task || t.task_type || '(loading…)', 60)"></div>
            <div class="text-[11px] text-slate-400 mt-0.5 flex items-center gap-2">
              <span class="px-1.5 py-0.5 rounded bg-slate-800/80 text-slate-300" x-text="t.assigned_agent_id || t.target_agent || 'unassigned'"></span>
              <span x-text="t.task_type"></span>
              <span class="text-slate-600">·</span>
              <span x-text="relTime(t.created_at)"></span>
            </div>
          </div>
          <span class="text-[10px] px-1.5 py-0.5 rounded uppercase tracking-wide text-slate-300 bg-slate-800/80" x-text="t.status"></span>
        </button>
      </template>
    </section>

    <!-- Right: task detail -->
    <aside id="detail" class="w-96 shrink-0 border-l border-slate-800 overflow-y-auto bg-slate-950/40">
      <template x-if="!selectedTask">
        <div class="px-4 py-10 text-xs text-slate-500 text-center">Select a task to view details.</div>
      </template>

      <template x-if="selectedTask">
        <div class="px-4 py-3 text-xs">
          <div class="flex items-center gap-2 mb-2">
            <span :class="statusDot(selectedTask.status)" class="inline-block w-2.5 h-2.5 rounded-full"></span>
            <span class="font-semibold text-slate-100" x-text="selectedTask.task_type"></span>
            <span class="ml-auto text-[10px] px-1.5 py-0.5 rounded uppercase tracking-wide text-slate-300 bg-slate-800/80" x-text="selectedTask.status"></span>
          </div>

          <div class="flex items-center gap-1 mb-3">
            <code class="text-[10px] text-slate-400 truncate" x-text="selectedTask.task_id"></code>
            <button @click="copyId(selectedTask.task_id)" class="text-[10px] text-emerald-300 hover:text-emerald-200 underline ml-auto" x-text="copyLabel"></button>
          </div>

          <div class="text-sm text-slate-200 mb-3" x-text="selectedTask.task"></div>

          <table class="w-full text-[11px] mb-3">
            <tbody class="divide-y divide-slate-800/60">
              <tr><td class="py-1 pr-2 text-slate-500">submitted_by</td><td class="py-1 text-slate-200" x-text="selectedTask.submitted_by || '—'"></td></tr>
              <tr><td class="py-1 pr-2 text-slate-500">target_agent</td><td class="py-1 text-slate-200" x-text="selectedTask.target_agent || '—'"></td></tr>
              <tr><td class="py-1 pr-2 text-slate-500">assigned_agent_id</td><td class="py-1 text-slate-200" x-text="selectedTask.assigned_agent_id || '—'"></td></tr>
              <tr><td class="py-1 pr-2 text-slate-500">created_at</td><td class="py-1 text-slate-200" x-text="selectedTask.created_at || '—'"></td></tr>
              <tr><td class="py-1 pr-2 text-slate-500">started_at</td><td class="py-1 text-slate-200" x-text="selectedTask.started_at || '—'"></td></tr>
              <tr><td class="py-1 pr-2 text-slate-500">completed_at</td><td class="py-1 text-slate-200" x-text="selectedTask.completed_at || '—'"></td></tr>
              <tr><td class="py-1 pr-2 text-slate-500">timeout</td><td class="py-1 text-slate-200" x-text="(selectedTask.timeout ?? '—') + 's'"></td></tr>
            </tbody>
          </table>

          <div class="text-[11px] uppercase tracking-wider text-slate-500 mb-1">Payload</div>
          <pre class="text-xs overflow-x-auto max-h-96 bg-slate-900/70 rounded p-2 mb-3 whitespace-pre-wrap break-words" x-text="prettyJson(selectedTask.payload)"></pre>

          <div class="text-[11px] uppercase tracking-wider text-slate-500 mb-1">Result</div>
          <div class="mb-3">
            <template x-if="resultIsMarkdown(selectedTask.result)">
              <div class="markdown text-xs text-slate-100" x-html="renderMarkdown(selectedTask.result.text)"></div>
            </template>
            <template x-if="!resultIsMarkdown(selectedTask.result) && selectedTask.result != null">
              <pre class="text-xs overflow-x-auto max-h-96 bg-slate-900/70 rounded p-2 whitespace-pre-wrap break-words" x-text="prettyJson(selectedTask.result)"></pre>
            </template>
            <template x-if="selectedTask.result == null">
              <div class="text-xs text-slate-500 italic">(no result yet)</div>
            </template>
          </div>

          <div class="text-[11px] uppercase tracking-wider text-slate-500 mb-1">Logs</div>
          <template x-if="(selectedTask.logs || []).length === 0">
            <div class="text-xs text-slate-500 italic">(no logs)</div>
          </template>
          <template x-if="(selectedTask.logs || []).length > 0">
            <pre class="text-xs overflow-x-auto max-h-96 bg-slate-900/70 rounded p-2 whitespace-pre-wrap break-words" x-text="(selectedTask.logs || []).join('\n')"></pre>
          </template>
        </div>
      </template>
    </aside>
  </main>

  <script>
    document.addEventListener('alpine:init', () => {
      // Single source of truth for header-button toggles → panel visibility.
      // Both buttons and panels read/write the same store entries, so toggle
      // works regardless of cross-component event timing.
      Alpine.store('mePanels', { keys: false, usage: false });
    });

    function meUsage() {
      const isoDay = (d) => d.toISOString().slice(0, 10);
      const today = new Date();
      const past = new Date(today.getTime() - 30 * 24 * 3600 * 1000);
      return {
        rows: [],
        byDay: [],
        byAgent: [],
        totals: {},
        loading: false,
        error: null,
        visible: false,
        dayChart: null,
        agentChart: null,
        _everRendered: false,
        filters: {
          from: isoDay(past),
          to: isoDay(today),
          agent: '',
          top_level_only: false,
        },
        sortKey: "completed_at",
        sortDir: "desc",
        sortBy(key) {
          if (this.sortKey === key) {
            this.sortDir = this.sortDir === 'asc' ? 'desc' : 'asc';
          } else {
            this.sortKey = key;
            this.sortDir = 'desc';
          }
        },
        sortedRows() {
          const k = this.sortKey;
          const dir = this.sortDir === 'asc' ? 1 : -1;
          return [...this.rows].sort((a, b) => {
            const av = a[k]; const bv = b[k];
            if (av == null && bv == null) return 0;
            if (av == null) return 1;
            if (bv == null) return -1;
            if (av < bv) return -1 * dir;
            if (av > bv) return 1 * dir;
            return 0;
          });
        },
        init() {
          this.$watch('$store.mePanels.usage', (val) => {
            if (val) {
              this.fetchUsage().then(() => this.$nextTick(() => this.renderCharts()));
            }
          });
        },
        async fetchUsage() {
          this.loading = true;
          this.error = null;
          try {
            const qs = new URLSearchParams();
            if (this.filters.from) qs.set('from', this.filters.from);
            if (this.filters.to) qs.set('to', this.filters.to + 'T23:59:59.999999');
            if (this.filters.agent) qs.set('agent', this.filters.agent);
            if (this.filters.top_level_only) qs.set('top_level_only', 'true');
            const r = await fetch('/me/usage?' + qs.toString(), { credentials: 'same-origin' });
            if (r.status === 403) {
              this.error = 'Sign in via Cloudflare Access to view usage.';
              this.rows = []; this.byDay = []; this.byAgent = []; this.totals = {};
              return;
            }
            if (!r.ok) throw new Error('HTTP ' + r.status);
            const data = await r.json();
            this.rows = data.rows || [];
            const agg = data.aggregates || {};
            this.byDay = agg.by_day || [];
            this.byAgent = agg.by_agent || [];
            this.totals = agg;
          } catch (e) {
            this.error = 'Failed to load usage: ' + (e.message || e);
            this.rows = []; this.byDay = []; this.byAgent = []; this.totals = {};
          } finally {
            this.loading = false;
          }
        },
        renderCharts() {
          if (typeof Chart === 'undefined') return;
          const dayEl = this.$refs.dayCanvas;
          const agentEl = this.$refs.agentCanvas;
          if (!dayEl || !agentEl) return;
          if (this.dayChart) { try { this.dayChart.destroy(); } catch {} this.dayChart = null; }
          if (this.agentChart) { try { this.agentChart.destroy(); } catch {} this.agentChart = null; }
          this.dayChart = new Chart(dayEl, {
            type: 'bar',
            data: {
              labels: this.byDay.map(d => d.day),
              datasets: [{ label: 'cost USD', data: this.byDay.map(d => d.cost_usd || 0), backgroundColor: '#10b981' }],
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#cbd5e1' } } }, scales: { x: { ticks: { color: '#94a3b8' } }, y: { ticks: { color: '#94a3b8' } } } },
          });
          const palette = ['#14b8a6', '#8b5cf6', '#f97316', '#3b82f6', '#ec4899', '#eab308'];
          this.agentChart = new Chart(agentEl, {
            type: 'doughnut',
            data: {
              labels: this.byAgent.map(a => a.agent_id || '(none)'),
              datasets: [{ data: this.byAgent.map(a => a.cost_usd || 0), backgroundColor: this.byAgent.map((_, i) => palette[i % palette.length]) }],
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#cbd5e1' } } } },
          });
          this._everRendered = true;
        },
        applyFilters() {
          this.fetchUsage().then(() => this.$nextTick(() => this.renderCharts()));
        },
      };
    }
    function meKeys() {
      return {
        keys: [],
        loading: false,
        creating: false,
        error: null,
        newKeyName: '',
        newKeyValue: null,
        copyLabel: 'Copy',
        open: false,

        init() {
          this.$watch('$store.mePanels.keys', (val) => {
            if (val) this.fetchKeys();
          });
        },

        async fetchKeys() {
          this.loading = true;
          this.error = null;
          try {
            const r = await fetch('/me/keys', { credentials: 'same-origin' });
            if (r.status === 403) {
              this.error = 'Sign in via Cloudflare Access to mint a key.';
              this.keys = [];
              return;
            }
            if (!r.ok) throw new Error('HTTP ' + r.status);
            this.keys = await r.json();
          } catch (e) {
            this.error = 'Could not load keys: ' + (e.message || e);
          } finally {
            this.loading = false;
          }
        },

        async createKey() {
          if (!this.newKeyName || this.creating) return;
          this.creating = true;
          this.error = null;
          try {
            const r = await fetch('/me/keys', {
              method: 'POST',
              credentials: 'same-origin',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ name: this.newKeyName }),
            });
            if (r.status === 403) { this.error = 'Sign in via Cloudflare Access to mint a key.'; return; }
            if (r.status === 409) { this.error = 'A key with that name already exists.'; return; }
            if (r.status === 422) { this.error = 'Invalid name (1-64 chars, [A-Za-z0-9_.-]).'; return; }
            if (r.status === 429) { this.error = 'Active key quota reached (10 keys).'; return; }
            if (!r.ok) throw new Error('HTTP ' + r.status);
            const body = await r.json();
            this.newKeyValue = body.api_key;
            this.copyLabel = 'Copy';
            this.newKeyName = '';
            await this.fetchKeys();
          } catch (e) {
            this.error = 'Could not create key: ' + (e.message || e);
          } finally {
            this.creating = false;
          }
        },

        async revokeKey(name) {
          if (!confirm('Revoke key "' + name + '"? This cannot be undone.')) return;
          this.error = null;
          try {
            const r = await fetch('/me/keys/' + encodeURIComponent(name), {
              method: 'DELETE',
              credentials: 'same-origin',
            });
            if (r.status === 403) { this.error = 'Sign in via Cloudflare Access.'; return; }
            if (r.status === 404) { this.error = 'Key not found.'; return; }
            if (!r.ok) throw new Error('HTTP ' + r.status);
            await this.fetchKeys();
          } catch (e) {
            this.error = 'Could not revoke key: ' + (e.message || e);
          }
        },

        copyKey() {
          if (!this.newKeyValue) return;
          try {
            navigator.clipboard.writeText(this.newKeyValue);
            this.copyLabel = 'Copied!';
            setTimeout(() => { this.copyLabel = 'Copy'; }, 1500);
          } catch {
            this.copyLabel = 'Copy failed';
          }
        },
      };
    }
    function hub() {
      return {
        // ----- state -----
        agents: [],
        tasks: [],
        stats: null,
        selectedAgent: null,
        selectedTaskId: null,
        loadErrors: { agents: null, tasks: null, stats: null },
        lastEventAt: Date.now(),
        liveSince: null,
        sseState: 'connecting', // connecting | live | reconnecting
        nowTick: Date.now(),
        copyLabel: 'copy id',
        _ssePreloadBuffer: [],
        _ssePreloadReady: false,
        _es: null,

        get selectedTask() {
          if (!this.selectedTaskId) return null;
          return this.tasks.find(t => t.task_id === this.selectedTaskId) || null;
        },

        // ----- init / load -----
        init() {
          // 1. open EventSource FIRST, buffer events until initial fetches resolve.
          this.openSSE();
          // 2. parallel fetch of /agents, /tasks, /stats.
          Promise.allSettled([
            this.fetchAgents(),
            this.fetchTasks(),
            this.fetchStats(),
          ]).then(() => {
            // 3. flush buffered SSE events against loaded state.
            this._ssePreloadReady = true;
            const buf = this._ssePreloadBuffer;
            this._ssePreloadBuffer = [];
            for (const msg of buf) this.applyEvent(msg);
          });
          // 4. heartbeat tick for relative time + staleness.
          setInterval(() => { this.nowTick = Date.now(); }, 1000);
        },

        async fetchAgents() {
          try {
            const r = await fetch('/agents', { credentials: 'same-origin' });
            if (!r.ok) throw new Error('HTTP ' + r.status);
            this.agents = await r.json();
          } catch (e) {
            this.loadErrors.agents = 'could not load agents — check Cloudflare Access session';
          }
        },
        async fetchTasks() {
          try {
            const r = await fetch('/tasks', { credentials: 'same-origin' });
            if (!r.ok) throw new Error('HTTP ' + r.status);
            this.tasks = await r.json();
          } catch (e) {
            this.loadErrors.tasks = 'could not load tasks — check Cloudflare Access session';
          }
        },
        async fetchStats() {
          try {
            const r = await fetch('/stats', { credentials: 'same-origin' });
            if (!r.ok) throw new Error('HTTP ' + r.status);
            this.stats = await r.json();
          } catch (e) {
            this.loadErrors.stats = 'could not load stats';
          }
        },
        async fetchTaskById(id) {
          try {
            const r = await fetch('/tasks/' + encodeURIComponent(id), { credentials: 'same-origin' });
            if (!r.ok) return null;
            return await r.json();
          } catch (e) { return null; }
        },

        // ----- SSE -----
        openSSE() {
          const es = new EventSource('/events');
          this._es = es;
          es.onopen = () => {
            this.sseState = 'live';
            this.lastEventAt = Date.now();
          };
          es.onmessage = (ev) => {
            this.lastEventAt = Date.now();
            this.sseState = 'live';
            let msg;
            try { msg = JSON.parse(ev.data); } catch { return; }
            if (!this._ssePreloadReady) {
              this._ssePreloadBuffer.push(msg);
              return;
            }
            this.applyEvent(msg);
          };
          es.onerror = () => {
            // Do NOT close + recreate; the browser auto-retries.
            this.sseState = 'reconnecting';
          };
        },

        applyEvent(msg) {
          if (!msg || !msg.type) return;
          const d = msg.data || {};
          switch (msg.type) {
            case 'connected':           this.liveSince = Date.now(); break;
            case 'agent_registered':    this.onAgentRegistered(d); break;
            case 'agent_status':        this.onAgentStatus(d); break;
            case 'agent_unregistered':  this.onAgentUnregistered(d); break;
            case 'task_created':        this.onTaskCreated(d); break;
            case 'task_updated':        this.onTaskUpdated(d); break;
            case 'task_completed':      this.onTaskCompleted(d); break;
          }
        },

        onAgentRegistered(d) {
          if (!d.agent_id) return;
          const idx = this.agents.findIndex(a => a.agent_id === d.agent_id);
          const stub = {
            agent_id: d.agent_id,
            name: d.agent_id,
            capabilities: d.capabilities || [],
            status: 'idle',
            last_heartbeat: new Date().toISOString(),
            machine_info: { platform: 'unknown' },
          };
          if (idx >= 0) this.agents[idx] = { ...this.agents[idx], ...stub, name: this.agents[idx].name || stub.name };
          else this.agents.push(stub);
        },
        onAgentStatus(d) {
          if (!d.agent_id) return;
          const a = this.agents.find(x => x.agent_id === d.agent_id);
          if (!a) return;
          a.status = d.status;
          a.last_heartbeat = new Date().toISOString();
        },
        onAgentUnregistered(d) {
          this.agents = this.agents.filter(a => a.agent_id !== d.agent_id);
          if (this.selectedAgent === d.agent_id) this.selectedAgent = null;
        },
        async onTaskCreated(d) {
          if (!d.task_id) return;
          if (this.tasks.find(t => t.task_id === d.task_id)) return; // already there (race w/ backfill)
          // optimistic stub, then backfill
          this.tasks.unshift({
            task_id: d.task_id,
            task: '',
            task_type: d.task_type || '',
            submitted_by: d.submitted_by || null,
            target_agent: null,
            assigned_agent_id: null,
            status: 'queued',
            created_at: new Date().toISOString(),
            payload: {},
            result: null,
            logs: [],
          });
          const full = await this.fetchTaskById(d.task_id);
          if (full) {
            const i = this.tasks.findIndex(t => t.task_id === d.task_id);
            if (i >= 0) this.tasks[i] = { ...this.tasks[i], ...full };
          }
        },
        async onTaskUpdated(d) {
          if (!d.task_id) return;
          const i = this.tasks.findIndex(t => t.task_id === d.task_id);
          if (i < 0) {
            const full = await this.fetchTaskById(d.task_id);
            if (full) this.tasks.unshift(full);
            return;
          }
          const t = this.tasks[i];
          if (d.status !== undefined) t.status = d.status;
          if (d.agent_id !== undefined) t.assigned_agent_id = d.agent_id;
          if (d.result !== undefined) t.result = d.result;
          if (d.log !== undefined) {
            t.logs = t.logs || [];
            t.logs.push(d.log);
          }
        },
        onTaskCompleted(d) {
          if (!d.task_id) return;
          const i = this.tasks.findIndex(t => t.task_id === d.task_id);
          if (i < 0) { this.onTaskUpdated(d); return; }
          const t = this.tasks[i];
          t.status = d.status || 'completed';
          if (d.result !== undefined) t.result = d.result;
          t.completed_at = t.completed_at || new Date().toISOString();
        },

        // ----- interaction -----
        toggleAgent(id) {
          this.selectedAgent = (this.selectedAgent === id) ? null : id;
        },
        selectTask(id) {
          this.selectedTaskId = id;
          this.copyLabel = 'copy id';
          // If the in-memory copy lacks result/logs, fetch the full record.
          const t = this.tasks.find(x => x.task_id === id);
          if (t && (t.result === undefined || t.logs === undefined)) {
            this.fetchTaskById(id).then(full => {
              if (!full) return;
              const idx = this.tasks.findIndex(x => x.task_id === id);
              if (idx >= 0) this.tasks[idx] = { ...this.tasks[idx], ...full };
            });
          }
        },
        copyId(id) {
          try {
            navigator.clipboard.writeText(id);
            this.copyLabel = 'copied!';
            setTimeout(() => { this.copyLabel = 'copy id'; }, 1200);
          } catch {
            this.copyLabel = 'copy failed';
          }
        },

        // ----- derived -----
        totalTasks() {
          const t = this.stats?.tasks;
          if (!t) return 0;
          return Object.values(t).reduce((a, b) => a + (Number(b) || 0), 0);
        },
        sortedAgents() {
          const order = { busy: 0, idle: 1, offline: 2 };
          return [...this.agents].sort((a, b) => {
            const oa = order[a.status] ?? 3, ob = order[b.status] ?? 3;
            if (oa !== ob) return oa - ob;
            return (a.name || a.agent_id).localeCompare(b.name || b.agent_id);
          });
        },
        filteredTasks() {
          const arr = this.selectedAgent
            ? this.tasks.filter(t => t.assigned_agent_id === this.selectedAgent || t.target_agent === this.selectedAgent)
            : this.tasks;
          return [...arr].sort((a, b) => {
            const av = a.created_at || '', bv = b.created_at || '';
            return bv.localeCompare(av);
          });
        },

        // ----- presentation helpers -----
        statusDot(status) {
          switch (status) {
            case 'idle':
            case 'completed': return 'bg-green-500';
            case 'busy':
            case 'running':   return 'bg-amber-500';
            case 'offline':   return 'bg-slate-400';
            case 'failed':
            case 'timeout':   return 'bg-red-500';
            case 'queued':    return 'bg-blue-400';
            case 'assigned':  return 'bg-blue-400';
            default:          return 'bg-slate-500';
          }
        },
        cliBadge(agent) {
          const id = (agent.agent_id || '').toLowerCase();
          if (id.startsWith('claude'))   return { label: 'claude',   cls: 'bg-teal-500' };
          if (id.startsWith('codex'))    return { label: 'codex',    cls: 'bg-violet-500' };
          if (id.startsWith('opencode')) return { label: 'opencode', cls: 'bg-orange-500' };
          return null;
        },
        agentSubtitle(a) {
          const mi = a.machine_info || {};
          return mi.hostname || mi.ip || mi.platform || '';
        },
        truncate(s, n) {
          s = s || '';
          return s.length > n ? s.slice(0, n - 1) + '…' : s;
        },
        relTime(iso) {
          if (!iso) return '—';
          const t = new Date(iso).getTime();
          if (isNaN(t)) return iso;
          const s = Math.max(0, Math.floor((this.nowTick - t) / 1000));
          if (s < 60) return s + 's ago';
          const m = Math.floor(s / 60);
          if (m < 60) return m + 'm ago';
          const h = Math.floor(m / 60);
          if (h < 24) return h + 'h ago';
          return Math.floor(h / 24) + 'd ago';
        },
        prettyJson(v) {
          if (v === null || v === undefined) return '';
          try { return JSON.stringify(v, null, 2); }
          catch { return String(v); }
        },
        resultIsMarkdown(r) {
          return r && typeof r === 'object' && typeof r.text === 'string';
        },
        renderMarkdown(text) {
          try {
            return DOMPurify.sanitize(marked.parse(text || ''));
          } catch (e) {
            return DOMPurify.sanitize(String(text || ''));
          }
        },

        // ----- heartbeat pill -----
        heartbeatDelta() { return this.nowTick - this.lastEventAt; },
        heartbeatLabel() {
          const delta = this.heartbeatDelta();
          const s = Math.max(0, Math.floor(delta / 1000));
          if (this.sseState === 'reconnecting' && delta < 30000) return 'Reconnecting…';
          if (delta < 30000) return 'Live · ' + s + 's ago';
          return 'Stale · ' + s + 's ago';
        },
        heartbeatDotClass() {
          const delta = this.heartbeatDelta();
          if (this.sseState === 'reconnecting' && delta < 30000) return 'bg-slate-400';
          if (delta < 30000) return 'bg-green-500 sse-pulse';
          return 'bg-amber-500';
        },
        heartbeatDotStyle() { return ''; },
      };
    }
  </script>
</body>
